<!DOCTYPE html>
<html>
<head>
  <title>Bookmark Manager</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; line-height: 1.6; }
    form { margin-bottom: 24px; display: flex; gap: 8px; }
    input { flex: 1; padding: 8px; }
    button { padding: 8px 14px; cursor: pointer; }
    ul { list-style: none; padding: 0; }
    li { padding: 10px; border-bottom: 1px solid #ccc; display: flex; justify-content: space-between; align-items: center; }
    a { color: #007bff; text-decoration: none; }
    .favorite-toggle-button {
      background: none;
      border: none;
      font-size: 1.4rem;
      color: gold;
      cursor: pointer;
      padding: 0 8px;
      line-height: 1;
    }
    .filter-container {
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
  </style>
</head>
<body>
  <h1>My Bookmarks</h1>

  <form action="/add" method="post">
    <input type="text" name="title" placeholder="Title" required>
    <input type="url" name="url" placeholder="https://example.com" required>
    <button type="submit">Add</button>
  </form>

  <div class="filter-container">
    <input type="checkbox" id="favorites-filter-toggle">
    <label for="favorites-filter-toggle" style="cursor: pointer; user-select: none;">Show Favorites Only</label>
  </div>

  <ul id="bookmark-list-container">
    {% for bookmark in bookmarks %}
      <li class="bookmark-item" data-favorited="{{ 'true' if bookmark.is_favorite else 'false' }}">
        <div style="display: flex; align-items: center; gap: 8px;">
          <button class="favorite-toggle-button" data-id="{{ bookmark.id }}" aria-label="Toggle Favorite">
            {{ '★' if bookmark.is_favorite else '☆' }}
          </button>
          <a href="{{ bookmark.url }}" target="_blank">{{ bookmark.title }}</a>
        </div>
        <form action="/delete/{{ bookmark.id }}" method="post" style="display:inline; margin:0;">
          <button type="submit">Delete</button>
        </form>
      </li>
    {% else %}
      <li class="no-bookmarks">No bookmarks yet.</li>
    {% endfor %}
  </ul>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const filterToggle = document.getElementById('favorites-filter-toggle');
      const listContainer = document.getElementById('bookmark-list-container');

      function applyFilter() {
        const showOnlyFavorites = filterToggle.checked;
        const items = listContainer.querySelectorAll('.bookmark-item');
        items.forEach(item => {
          const isFavorited = item.getAttribute('data-favorited') === 'true';
          if (showOnlyFavorites && !isFavorited) {
            item.style.display = 'none';
          } else {
            item.style.display = 'flex';
          }
        });
      }

      filterToggle.addEventListener('change', applyFilter);

      listContainer.addEventListener('click', async (event) => {
        const toggleBtn = event.target.closest('.favorite-toggle-button');
        if (!toggleBtn) return;

        event.preventDefault();
        const bookmarkId = toggleBtn.getAttribute('data-id');
        const listItem = toggleBtn.closest('.bookmark-item');

        try {
          const response = await fetch(`/toggle_favorite/${bookmarkId}`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            }
          });

          if (response.ok) {
            const data = await response.json();
            const isFav = data.is_favorite !== undefined ? data.is_favorite : (data.favorite !== undefined ? data.favorite : (listItem.getAttribute('data-favorited') !== 'true'));
            toggleBtn.textContent = isFav ? '★' : '☆';
            listItem.setAttribute('data-favorited', isFav ? 'true' : 'false');
            applyFilter();
          } else {
            console.error('Failed to toggle favorite status');
          }
        } catch (error) {
          console.error('Error toggling favorite:', error);
        }
      });
    });
  </script>
</body>
</html>
